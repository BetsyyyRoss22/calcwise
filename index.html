<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CalcWise</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f8fafc;
      color: #111827;
    }
    .wrap {
      max-width: 1000px;
      margin: 0 auto;
      padding: 32px 20px;
    }
    h1 {
      font-size: 42px;
      margin-bottom: 8px;
    }
    p {
      color: #475569;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-top: 28px;
    }
    .card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 20px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-top: 14px;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      box-sizing: border-box;
    }
    .result-label {
      color: #64748b;
      font-size: 14px;
    }
    .result-value {
      font-size: 28px;
      font-weight: 700;
      margin-top: 8px;
    }
    @media (max-width: 800px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>CalcWise</h1>
    <p>Simple calculators for smarter money decisions.</p>

    <div class="grid">
      <div class="card">
        <h2>Compound Interest Calculator</h2>

        <label>Starting amount</label>
        <input id="principal" type="number" value="10000" />

        <label>Monthly contribution</label>
        <input id="monthly" type="number" value="500" />

        <label>Annual return (%)</label>
        <input id="rate" type="number" value="8" step="0.01" />

        <label>Years</label>
        <input id="years" type="number" value="20" />
      </div>

      <div>
        <div class="card">
          <div class="result-label">Projected value</div>
          <div class="result-value" id="total">$0</div>
        </div>

        <div class="card" style="margin-top:16px;">
          <div class="result-label">Total contributed</div>
          <div class="result-value" id="contributed">$0</div>
        </div>

        <div class="card" style="margin-top:16px;">
          <div class="result-label">Investment growth</div>
          <div class="result-value" id="growth">$0</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function currency(n) {
      return new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency: 'USD',
        maximumFractionDigits: 0
      }).format(isFinite(n) ? n : 0);
    }

    function calculate() {
      const P = Number(document.getElementById('principal').value || 0);
      const PMT = Number(document.getElementById('monthly').value || 0);
      const annualRate = Number(document.getElementById('rate').value || 0);
      const years = Number(document.getElementById('years').value || 0);

      const r = annualRate / 100 / 12;
      const n = years * 12;

      const fvPrincipal = P * Math.pow(1 + r, n);
      const fvContrib = r === 0 ? PMT * n : PMT * ((Math.pow(1 + r, n) - 1) / r);
      const total = fvPrincipal + fvContrib;
      const contributed = P + PMT * n;
      const growth = total - contributed;

      document.getElementById('total').textContent = currency(total);
      document.getElementById('contributed').textContent = currency(contributed);
      document.getElementById('growth').textContent = currency(growth);
    }

    ['principal', 'monthly', 'rate', 'years'].forEach(id => {
      document.getElementById(id).addEventListener('input', calculate);
    });

    calculate();
  </script>
</body>
</html>
